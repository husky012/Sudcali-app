# HTTPS con certificado de prueba (Práctica 6, medida 11):
#   docker compose -f compose.yml -f compose.https.yml up -d --build
services:
    balanceador:
        ports:
            - "127.0.0.1:8443:8443"
        volumes:
            - ./docs/servidor/docker/balanceo-https.conf:/etc/nginx/conf.d/default.conf:ro
            # Se crean con el comando de docs/practica5.md y no se suben al repositorio.
            - ./docs/servidor/docker/certificados:/etc/nginx/certificados:ro

    app1:
        environment: &produccion
            APP_ENV: production
            APP_URL: https://sudcali.localhost:8443
            SESSION_SECURE_COOKIE: "true"
            HSTS_MAX_AGE: "300"

    app2:
        environment: *produccion
