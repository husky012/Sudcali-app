# Sudcali: HTTPS, redirección y balanceo con Nginx, para un servidor Linux.
# Copiar a /etc/nginx/conf.d/sudcali.conf y cambiar sudcali.example por el dominio real.
# Comprobar con "nginx -t" y aplicar con "systemctl reload nginx".

# Grupo de servidores que ejecutan la aplicación.
upstream sudcali_nodos {
    # Estado compartido entre los procesos de Nginx: conexiones activas y fallos de cada nodo.
    zone sudcali_nodos 64k;
    # Cada petición nueva va al nodo con menos conexiones activas (Práctica 5).
    least_conn;
    # Los nodos escuchan en la red privada; desde internet no se llega a ellos.
    # Si un nodo falla 3 veces en 10 segundos se deja de usar durante 10 segundos.
    server 10.0.0.11:8000 max_fails=3 fail_timeout=10s;
    server 10.0.0.12:8000 max_fails=3 fail_timeout=10s;
}

# Traduce el encabezado Upgrade: si el navegador pide WebSocket se conserva, si no se cierra.
map $http_upgrade $conexion_upgrade {
    default upgrade;
    ''      close;
}

# Límite general por IP antes de llegar a la aplicación: 10 peticiones por segundo.
limit_req_zone $binary_remote_addr zone=por_ip:10m rate=10r/s;

# Servidor por defecto del puerto 80: descarta peticiones con un dominio que no es el nuestro.
server {
    listen 80 default_server;
    server_name _;
    # 444 cierra la conexión sin responder nada.
    return 444;
}

# HTTP: solo existe para renovar el certificado y redirigir.
server {
    # Puerto sin cifrar.
    listen 80;
    # Dominios que atiende.
    server_name sudcali.example www.sudcali.example;

    # Let's Encrypt comprueba el dominio leyendo un archivo de esta carpeta (reto HTTP-01).
    location /.well-known/acme-challenge/ {
        # Carpeta que Certbot usa para dejar ese archivo.
        root /var/www/certbot;
    }

    # Todo lo demás se manda a HTTPS de forma permanente.
    location / {
        # 301: los navegadores y buscadores recuerdan la dirección nueva.
        return 301 https://sudcali.example$request_uri;
    }
}

# HTTPS: el sitio. Aquí termina TLS; los nodos no necesitan certificado propio.
server {
    # Puerto cifrado.
    listen 443 ssl;
    # HTTP/2: varias descargas por una sola conexión.
    http2 on;
    # Dominio principal.
    server_name sudcali.example;

    # Certificado del sitio seguido de los intermedios (la cadena completa).
    ssl_certificate     /etc/letsencrypt/live/sudcali.example/fullchain.pem;
    # Llave privada. Solo root puede leerla (chmod 600) y nunca va al repositorio.
    ssl_certificate_key /etc/letsencrypt/live/sudcali.example/privkey.pem;

    # Solo versiones vigentes de TLS; quedan fuera SSLv3, TLS 1.0 y TLS 1.1.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Recuerda sesiones TLS para no repetir el saludo completo en cada visita.
    ssl_session_cache shared:TLS:10m;
    # Tiempo que se recuerda cada sesión.
    ssl_session_timeout 1d;
    # Sin tickets: si se filtrara su llave, se podrían descifrar sesiones grabadas.
    ssl_session_tickets off;

    # No anunciar la versión de Nginx.
    server_tokens off;
    # Tamaño máximo de una petición: la imagen de producto más grande es de 4 MB.
    client_max_body_size 6m;

    # Archivos del sitio (solo la carpeta public; el código y storage quedan fuera).
    root /var/www/sudcali/public;

    # Archivos estáticos: los entrega Nginx sin pasar por Laravel, por eso lleva aquí sus cabeceras.
    location ~ ^/(build|imagenes|js)/ {
        # Si el archivo no existe, 404; nunca se ejecuta nada.
        try_files $uri =404;
        # Guardar en el navegador un día.
        expires 1d;
        # Usar siempre HTTPS. Empezar con max-age=300 y subirlo por etapas.
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
        # No adivinar el tipo de archivo.
        add_header X-Content-Type-Options "nosniff" always;
        # No contar a otros sitios la dirección completa.
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Sin cámara, micrófono ni ubicación.
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        # Nada de lo que cargue un archivo estático abierto directamente se ejecuta.
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none'" always;
    }

    # El service worker tiene que estar en la raíz y revisarse en cada visita.
    location = /sw.js {
        # Entrega el archivo tal cual.
        try_files $uri =404;
        # Siempre preguntar si cambió.
        add_header Cache-Control "no-cache" always;
        # No adivinar el tipo de archivo.
        add_header X-Content-Type-Options "nosniff" always;
        # Usar siempre HTTPS.
        add_header Strict-Transport-Security "max-age=300; includeSubDomains" always;
    }

    # Archivos ocultos (.env, .git): prohibidos.
    location ~ /\. {
        # 404 en vez de 403 para no confirmar que existen.
        return 404;
    }

    # WebSocket del Catálogo de Personal (WEBSOCKET_URL=wss://sudcali.example/ws).
    location /ws {
        # Servidor Node que atiende el WebSocket, en la red privada.
        proxy_pass http://10.0.0.11:3000;
        # WebSocket necesita HTTP/1.1.
        proxy_http_version 1.1;
        # Pasa la petición de cambio de protocolo.
        proxy_set_header Upgrade $http_upgrade;
        # Completa el cambio de protocolo.
        proxy_set_header Connection $conexion_upgrade;
        # Dominio que pidió el navegador.
        proxy_set_header Host $host;
        # La dirección lleva el token: no se escribe en la bitácora de accesos.
        access_log off;
        # Mantener abierta la conexión hasta una hora sin mensajes.
        proxy_read_timeout 1h;
    }

    # Todo lo demás lo resuelve Laravel.
    location / {
        # Aplica el límite por IP y tolera ráfagas cortas de 40 peticiones.
        limit_req zone=por_ip burst=40 nodelay;
        # Reparte entre los nodos. Es HTTP porque viaja por la red privada.
        proxy_pass http://sudcali_nodos;
        # Dominio (y puerto, si lo hay) que pidió el navegador.
        proxy_set_header Host $http_host;
        # IP real del visitante. Se sobrescribe: no se acepta la que mande el cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        # Avisa que el visitante llegó por HTTPS (lo lee TrustProxies en Laravel).
        proxy_set_header X-Forwarded-Proto $scheme;
        # Mismo dato para el nombre del sitio.
        proxy_set_header X-Forwarded-Host $host;
        # Puerto público.
        proxy_set_header X-Forwarded-Port $server_port;
        # No revelar con qué está hecho el sitio.
        proxy_hide_header X-Powered-By;
        # Cuánto esperar a un nodo antes de probar otro.
        proxy_connect_timeout 3s;
        # Las cabeceras de seguridad de las páginas las pone Laravel (CabecerasSeguridad).
    }
}
