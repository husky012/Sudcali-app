# Balanceador de la Práctica 5 (HTTP, puerto 8080 del equipo).
server {
    listen 80;
    # No anunciar la versión de Nginx.
    server_tokens off;
    # La imagen de producto más grande es de 4 MB.
    client_max_body_size 6m;

    # El navegador pide el icono en cada recarga y se come un turno.
    location = /favicon.ico {
        return 204;
    }

    # Archivos ocultos (.env, .git): prohibidos.
    location ~ /\. {
        return 404;
    }

    location / {
        # Reparte entre los nodos.
        proxy_pass http://sudcali_nodos;
        # Dominio con el puerto: sin él, los enlaces y redirecciones saldrían sin :8080.
        proxy_set_header Host $http_host;
        # IP real del visitante.
        proxy_set_header X-Real-IP $remote_addr;
        # Se sobrescribe (no se agrega) para que nadie pueda inventar su IP.
        proxy_set_header X-Forwarded-For $remote_addr;
        # http o https, según cómo llegó el visitante.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Dominio y puerto públicos.
        proxy_set_header X-Forwarded-Host $http_host;
        # Si un nodo no contesta, se intenta con el otro (los POST ya enviados no se repiten).
        proxy_next_upstream error timeout http_502 http_503 http_504;
        # Cuánto esperar la conexión antes de dar por caído al nodo.
        proxy_connect_timeout 2s;
        # No revelar con qué está hecho el sitio.
        proxy_hide_header X-Powered-By;
        # Qué nodo atendió: se ve en F12 › Red. Solo para la práctica; en producción se quita.
        add_header X-Nodo $upstream_addr always;
    }
}
