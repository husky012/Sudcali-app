# Algoritmo 1: turno rotatorio. Es el que Nginx usa si no se indica otro.
upstream sudcali_nodos {
    # Estado compartido entre los procesos de Nginx. Sin esto, cada uno descubre por su cuenta al nodo caído.
    zone sudcali_nodos 64k;
    # Nodos por su IP fija: Nginx arranca aunque uno esté apagado.
    # Tras 2 fallos seguidos en 10 segundos, el nodo descansa 10 segundos.
    server 172.28.0.11:8000 max_fails=2 fail_timeout=10s;
    server 172.28.0.12:8000 max_fails=2 fail_timeout=10s;
}
